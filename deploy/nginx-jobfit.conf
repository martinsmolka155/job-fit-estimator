# Example nginx site config for the Job Fit Estimator (public deploy).
#
# Solves three things the app cannot do alone:
#   1. Cross-worker / cross-process rate limiting (the in-app limiter is
#      per-process only — behind multiple uvicorn workers it would let each
#      worker grant its own quota). nginx limit_req enforces one shared limit.
#      This is the lightweight answer; Redis is overkill at this scale.
#   2. CSP that ALLOWS Google Fonts — otherwise Fraunces + Hanken Grotesk fall
#      back to system fonts (learned the hard way on lilithai.dev).
#   3. A trusted X-Forwarded-For so the app's per-IP limiter sees the REAL
#      client and the header can't be spoofed (we OVERWRITE, not append).
#
# Place at /etc/nginx/sites-available/jobfit.lilithai.dev, symlink into
# sites-enabled, then `sudo nginx -t && sudo systemctl reload nginx`.
# NOTE: do NOT leave backup copies (*.bak) inside sites-enabled/ — nginx globs
# the whole dir and duplicate directives break `nginx -t`.

# Shared rate-limit zone: 5 requests/minute per client IP for the costly
# /analyze endpoint (each call hits OpenAI). 10m of state ~= 160k IPs.
limit_req_zone $binary_remote_addr zone=jobfit_analyze:10m rate=5r/m;

upstream jobfit_app {
    server 127.0.0.1:8099;   # uvicorn api:app (run with --workers >1 safely now)
}

server {
    listen 443 ssl http2;
    server_name jobfit.lilithai.dev;

    # ssl_certificate / ssl_certificate_key managed by certbot
    # include /etc/letsencrypt/options-ssl-nginx.conf;

    # Reject oversized uploads at the edge, before the app reads the body.
    client_max_body_size 10m;

    # Security headers. CSP allows Google Fonts (style + font src) and the
    # page's own inline script/style; everything else is same-origin only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate-limit only the expensive endpoint; allow a tiny burst, no delay.
    location = /analyze {
        limit_req zone=jobfit_analyze burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://jobfit_app;
        proxy_set_header Host $host;
        # OVERWRITE (not append) — the app trusts the left-most XFF hop as the
        # client, so a single trusted value prevents spoofing the limiter.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;   # analysis can take ~30–60s
    }

    location / {
        proxy_pass http://jobfit_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80;
    server_name jobfit.lilithai.dev;
    return 301 https://$host$request_uri;
}
