[project]
name = "job-fit-estimator"
version = "0.1.0"
description = "CV analysis pipeline: seniority scoring, salary estimation, LLM recommendations"
requires-python = ">=3.11"
dependencies = [
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.2",
    "openai>=1.55.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "streamlit>=1.40.0",
    "rich>=13.0",
    "reportlab>=4.2.0",
    "structlog>=24.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
    "ruff>=0.9.0",
    "pyright>=1.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["prompts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.12",
]
