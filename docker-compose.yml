services:
  app:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      # Read-write so the cost log (data/.cost_log.jsonl) and ISPV download
      # can persist across restarts. ISPV XLSX itself is rarely written from
      # inside the container — it's downloaded by the sidebar button.
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
